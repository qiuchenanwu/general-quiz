[project]
name = "general-quiz-backend"
version = "0.1.0"
description = "general-quiz · Django backend (no AI deps by default)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # Pin to the Django major this repo targets. Tested with 6.x.
    "Django>=5.0,<7.0",
]

[project.optional-dependencies]
# tools/ 里几个脚本需要 PyMuPDF（PDF 规则解析器）
pdf = ["PyMuPDF>=1.24"]
# Java 沙箱需要 JDK + bubblewrap 才能跑（脚本里有自检）
java = []
# 真浏览器验收需要 Playwright（chromium 自己装）
e2e = ["playwright>=1.40"]
# Lint / test
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "tests.py"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# 跟代码里的现状保持一致：单行 import、E501 适当放行（行内注释很长）。
select = ["E", "F", "W", "I", "B"]
ignore = [
    "E501",  # 行长：注释里偶尔有长 URL
    "B008",  # 函数调用出现在默认值（django 模板常用）
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["config", "apps"]
